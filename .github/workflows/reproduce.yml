name: Reproduce and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/urban4-matplotlib
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verified dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-verified.txt

      - name: Apply v2.9 evidence-grounded inputs
        run: python scripts/apply_v2_9_reference_grounding.py

      - name: Reproduce models and run tests
        run: python run_all.py

      - name: Upload v2.9 rerun outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban4-v2.9-rerun
          if-no-files-found: warn
          retention-days: 7
          path: |
            cases/schweinfurt.json
            outputs/**
            figures/**
            docs/**
